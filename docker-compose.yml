services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowsense-backend
    restart: unless-stopped
    mem_limit: 850m
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=FlowSense - Priority Routing & Perception
      - PILOT_CITY=New York (Manhattan)
      - CONGESTION_ALPHA=3.0
      - ROUTING_ALGORITHM=astar
      - FLOWSENSE_API_KEY=flowsense-operator-v1
    volumes:
      - ./data/processed:/app/data/processed
      - ./models:/app/models
    networks:
      - flowsense-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowsense-frontend
    restart: unless-stopped
    mem_limit: 150m
    ports:
      - "80:80"
      - "443:443"
      - "5173:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - flowsense-net

networks:
  flowsense-net:
    driver: bridge
