# Rate Limiting & Connection Limiting Zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_heavy:5m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=addr_conn:5m;

# Return 429 Too Many Requests instead of default 503
limit_req_status 429;
limit_conn_status 429;

# Safe mapping for WebSocket Connection header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Hide Nginx version tokens
    server_tokens off;

    # DoS protection: limit client request body and timeouts
    client_max_body_size 10M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Security Headers (OWASP Hardened)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.openstreetmap.org https://openstreetmap.org https://*.tile.opentopomap.org https://*.opentopomap.org https://opentopomap.org https://*.basemaps.cartocdn.com https://*.cartocdn.com https://cartocdn.com https://unpkg.com https://*.dot.ca.gov https://cwwp2.dot.ca.gov https://quickmap.dot.ca.gov; media-src 'self' data: blob: https://*.dot.ca.gov https://wzmedia.dot.ca.gov; connect-src 'self' https://flowsense.duckdns.org wss://flowsense.duckdns.org https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.openstreetmap.org https://*.dot.ca.gov https://wzmedia.dot.ca.gov http://localhost:* ws://localhost:*; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none';" always;

    # Access and Error logging
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Static assets with long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # A. Real-Time WebSocket Telemetry Channel (/ws/telemetry)
    # -------------------------------------------------------------------------
    location ~ ^/ws/ {
        limit_conn addr_conn 4;
        limit_req zone=api_general burst=5 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
    }

    # -------------------------------------------------------------------------
    # B. CPU/RAM Heavy Endpoints (Graph Search, Monte Carlo, OpenCV, PDF)
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/(benchmark/run|dispatch/fleet|dispatch/alternatives|perception/start|graph/reset|mobility/reports/cases\.pdf) {
        limit_req zone=api_heavy burst=2 nodelay;
        limit_conn addr_conn 2;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }

    # -------------------------------------------------------------------------
    # C. General REST API and Swagger Docs
    # -------------------------------------------------------------------------
    location ~ ^/(api/|docs|openapi\.json) {
        limit_req zone=api_general burst=20 nodelay;
        limit_conn addr_conn 10;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # -------------------------------------------------------------------------
    # D. Single Page Application (SPA) Client Routing
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=api_general burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
