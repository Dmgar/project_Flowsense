# Rate Limiting & Connection Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req_status 429;

# Redirect all HTTP traffic to secure HTTPS
server {
    listen 80;
    server_name flowsense.duckdns.org _;
    return 301 https://$host$request_uri;
}

# Production HTTPS Server
server {
    listen 443 ssl;
    server_name flowsense.duckdns.org _;

    ssl_certificate /etc/letsencrypt/live/flowsense.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowsense.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # DoS protection: limit maximum client request body
    client_max_body_size 10M;

    # Security Headers (OWASP Hardened)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://flowsense.duckdns.org wss://flowsense.duckdns.org https://*.tile.openstreetmap.org https://*.tile.opentopomap.org https://cwwp2.dot.ca.gov https://*.dot.ca.gov; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.tile.opentopomap.org https://cwwp2.dot.ca.gov https://*.dot.ca.gov https://quickmap.dot.ca.gov; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Static assets with long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend REST API with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reverse proxy for Swagger docs and OpenAPI schema
    location /docs {
        limit_req zone=api_limit burst=15 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        limit_req zone=api_limit burst=15 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Reverse proxy for real-time WebSockets (WSS) with connection limits
    location /ws/ {
        limit_conn conn_limit 10;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
